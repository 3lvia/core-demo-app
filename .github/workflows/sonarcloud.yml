name: SonarCloud
on:
  push:
    branches:
      - trunk
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  build:
    name: SonarCloud
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Cache SonarCloud packages
        uses: actions/cache@v3
        with:
          path: ~/sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Cache SonarCloud scanner
        id: cache-sonar-scanner3
        uses: actions/cache@v3
        with:
          path: ./sonar/scanner
          key: ${{ runner.os }}-sonar-scanner3
          restore-keys: ${{ runner.os }}-sonar-scanner3
      - name: Install SonarCloud scanner
        if: steps.cache-sonar-scanner3.outputs.cache-hit != 'true'
        run: |
          mkdir ./sonar ./sonar/scanner
          dotnet tool update dotnet-sonarscanner --tool-path ./sonar/scanner
          dotnet tool install dotnet-coverage --tool-path ./sonar/scanner
      - name: Build and analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./sonar/scanner/dotnet-sonarscanner begin /k:"3lvia_core-demo-app" /o:"elvia" /d:sonar.login="${{ secrets.SONAR_TOKEN }}" /d:sonar.host.url="https://sonarcloud.io" /d:sonar.cs.vscoveragexml.reportsPaths=coverage.xml
          dotnet build
          ./sonar/scanner/dotnet-coverage collect 'dotnet test --filter "FullyQualifiedName!~Test.Integration"' -f xml  -o 'coverage.xml'
          ./sonar/scanner/dotnet-sonarscanner end /d:sonar.login="${{ secrets.SONAR_TOKEN }}"
