name: Build and Deploy to Kubernetes

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]
  workflow_dispatch:
    branches:
      - trunk

env:
  APPLICATION_NAME: demo-app
  SYSTEM_NAMESPACE: core
  DOCKER_FILE: core-demo-api/Dockerfile
  HELM_VALUES: '.github/deploy/values.yaml'

jobs:
  unittests:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      issues: read
      pull-requests: write
    steps:
      - uses: 3lvia/core-github-actions-templates/unittest@trunk
        with:
          test-coverage: 'true'
  sonarcloud:
    name: Sonarcloud
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      issues: read
      pull-requests: write
    steps:
      - uses: 3lvia/core-github-actions-templates/sonarcloud@trunk
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sonarcloud-token: ${{ secrets.SONAR_TOKEN }}
          sonarcloud-project-key: '3lvia_core-demo-app'
